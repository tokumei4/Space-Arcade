<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Alien Battle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <!-- UI Dashboard Overlay -->
        <div class="ui-panel">
            <div class="score-box">SCORE: <span id="scoreVal">0</span></div>
            <div id="difficultyDisplay" class="mode-box">DANGER: 1.0x</div>
            <div class="health-box">HP: <span id="hpVal">100</span>%</div>
        </div>

        <!-- The Canvas screen where everything is drawn -->
        <canvas id="gameCanvas" width="600" height="600"></canvas>

        <!-- Dynamic mobile firing control button overlay -->
        <div class="controls-overlay">
            <button id="mobileFireBtn">🔥 FIRE</button>
        </div>

        <!-- Game Over screen overlay, hidden by default -->
        <div id="gameOverScreen" class="overlay hidden">
            <h1>GAME OVER</h1>
            <p>The armada overwhelmed your defense sector.</p>
            <button id="restartBtn">RELAUNCH</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
